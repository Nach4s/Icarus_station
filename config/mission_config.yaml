# Icarus Station Mission Configuration

station:
  name: "Icarus Station"
  mission_id: "ICARUS-2026"
  crew_size: 5000
  location: "Jupiter Orbit"
  mission_duration: "80 Earth Years"
  mission_start: "2026"

# =============================================================================
# ENVIRONMENT SENSORS - Real Arduino Sensors
# =============================================================================
environment:
  # DHT22 (AM2302) - Temperature
  temperature:
    min: 15.0
    max: 35.0
    optimal: 22.0
    unit: "°C"
    alert_threshold: 5.0
    critical_threshold: 10.0
    sensor: "DHT22"
  
  # DHT22 (AM2302) - Humidity
  humidity:
    min: 30.0
    max: 70.0
    optimal: 50.0
    unit: "%"
    alert_threshold: 15.0
    critical_threshold: 25.0
    sensor: "DHT22"
  
  # BMP280 - Atmospheric Pressure
  pressure:
    min: 950.0
    max: 1050.0
    optimal: 1013.25
    unit: "hPa"
    alert_threshold: 30.0
    critical_threshold: 50.0
    sensor: "BMP280"
  
  # MQ-2 - Smoke/Gas Detector
  smoke:
    min: 0
    max: 30
    optimal: 0
    unit: "%"
    alert_threshold: 20
    critical_threshold: 40
    sensor: "MQ-2"
  
  # MQ-7 - Carbon Monoxide (CO) Detector
  co:
    min: 0
    max: 30
    optimal: 0
    unit: "%"
    alert_threshold: 20
    critical_threshold: 40
    sensor: "MQ-7"

# =============================================================================
# POWER SYSTEM
# =============================================================================
power:
  total_capacity: 274.608462  # MW
  critical_threshold: 20.0
  warning_threshold: 40.0
  
  satellites:
    total_count: 465439
    power_per_satellite: 0.00059
    critical_threshold: 0.5
    warning_threshold: 0.8
    uptime_target: 100.0
    max_capacity: 274.608462

  systems:
    - name: "Agriculture"
      priority: "critical"
      power_draw: 10.304462
    - name: "Oxygen Production"
      priority: "critical"
      power_draw: 15.0
    - name: "Lighting"
      priority: "normal"
      power_draw: 11.304
    - name: "Population Usage"
      priority: "normal"
      power_draw: 238.0

# =============================================================================
# TASKS
# =============================================================================
tasks:
  categories:
    - "Maintenance"
    - "Research"
    - "Exercise"
    - "Communication"
    - "Emergency"
  
  priorities:
    - "Critical"
    - "High"
    - "Medium"
    - "Low"
  
  default_tasks:
    - name: "Air filter maintenance"
      category: "Maintenance"
      priority: "High"
      duration: 45
      frequency: "daily"
    - name: "Hydroponic check"
      category: "Maintenance"
      priority: "Medium"
      duration: 30
      frequency: "daily"
    - name: "Sensor recalibration"
      category: "Maintenance"
      priority: "Medium"
      duration: 60
      frequency: "weekly"
    - name: "Communication system test"
      category: "Communication"
      priority: "High"
      duration: 20
      frequency: "daily"

# =============================================================================
# NUTRITION
# =============================================================================
nutrition:
  daily_requirements:
    calories:
      optimal: 2500
      unit: "kcal"
      warning_threshold: 200
      current_baseline: 2380
    protein:
      optimal: 100
      unit: "g"
      warning_threshold: 15
      current_baseline: 85
    water:
      optimal: 2.0
      unit: "L"
      warning_threshold: 0.3
      current_baseline: 1.6
    vitamins:
      optimal: 100
      unit: "%"
      warning_threshold: 10
      current_baseline: 92
  
  meal_schedule:
    - time: "07:30"
      meal: "Breakfast"
      menu: "Quail egg omelet with spinach and wheat bread, strawberries"
      icon: "🍳"
    - time: "11:00"
      meal: "Morning Snack"
      menu: "Bread, boiled egg, dried vegetables"
      icon: "🥖"
    - time: "13:00"
      meal: "Lunch"
      menu: "Tilapia with mashed potatoes and tomato-carrot salad"
      icon: "🐟"
    - time: "16:00"
      meal: "Afternoon Snack"
      menu: "Strawberries, protein bar"
      icon: "🍓"
    - time: "19:00"
      meal: "Dinner"
      menu: "Stewed rabbit with beans, onions, and herbs"
      icon: "🥕"
  
  storage:
    - name: "Freeze-dried Meals"
      icon: "freeze"
      quantity: 45
      unit: "packs"
      daily_consumption: 3
      critical_days: 5
    - name: "Protein Bars"
      icon: "freeze"
      quantity: 24
      unit: "bars"
      daily_consumption: 3
      critical_days: 3
    - name: "Water Supply"
      icon: "water"
      quantity: 40
      unit: "L"
      daily_consumption: 12
      critical_days: 2
    - name: "Greens (hydroponic)"
      icon: "greens"
      quantity: 0
      unit: "continuous"
      daily_consumption: 0
      critical_days: 0
  
  systems:
    hydroponic_status: "nominal"
    water_filtration_last_maintenance: 3

# =============================================================================
# ALERTS
# =============================================================================
alerts:
  levels:
    - name: "info"
      color: "#3b82f6"
    - name: "warning"
      color: "#f59e0b"
    - name: "critical"
      color: "#ef4444"
  
  auto_notify: true
  sound_enabled: true
  log_retention_days: 30
